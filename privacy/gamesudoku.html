  <noscript><main><h1>Privacy Policy</h1><p>JavaScript is required to display this policy.</p><p>Contact: <a href="mailto:arcblack.app@gmail.com">arcblack.app@gmail.com</a></p></main></noscript>
  <script>
    (() => {
      "use strict";
      const common = {
        en: { name:"English", title:"Privacy Policy", app:"Cat Rescue: Sudoku", effective:"Effective date", operator:"Operator", contact:"Contact", date:"August 31, 2026", updated:"Last updated: August 31, 2026", headings:["General principles","Game data stored on the device","Advertising and analytics services","Consent and privacy choices","External links","Third-party disclosure and international processing","Retention and deletion","Your rights","Children’s privacy","Security and changes"], body:["Cat Rescue: Sudoku (the App) does not require registration and does not directly collect your name, email address, phone number, or precise location on the operator’s servers.","Game progress, entries, notes, completed puzzles, play history, rescue progress, settings, and advertising-frequency information are stored in the browser or App WebView on your device. This data is used to continue games, restore progress, show statistics, and manage ads.","The App may use Google Mobile Ads SDK (AdMob) for non-personalized advertising and Google User Messaging Platform (UMP) where consent is required. AdMob/UMP may process IP address and approximate location, ad interactions, app/device identifiers, and SDK performance, error, and diagnostic information. The App also uses Firebase Analytics (Google Analytics for Firebase) to measure and improve the game. It may process events such as game starts, game completions, hint use, rewarded-ad completions, and screen transitions, together with an app-instance identifier, session information, device/app information, and approximate location. Google/Firebase determines processing and retention under its policies.","Where required by law, Google’s consent notice is shown before an ad request. Where available, advertising choices can be reopened from Ad Privacy Settings in the App. If required processing is not permitted, the App may not request ads.","The App may show links to other apps or store pages. External services process information under their own privacy policies.","The operator does not sell or disclose game-progress data. Google/Firebase may process advertising and analytics information on servers outside your country under their policies and applicable law.","On-device game data remains until App/site data is cleared or the App is uninstalled. Consent, advertising, and analytics information is retained according to Google/Firebase policies and applicable law. Clear App/site data or uninstall the App to delete local game data.","You may review advertising choices in device and App privacy settings. Contact the operator for privacy questions or requests: arcblack.app@gmail.com.","The App does not directly collect children’s names, contact details, or account information. Distribution to children must follow applicable age, advertising, and privacy safeguards.","This policy may change when App features, services, or laws change. Material changes will be announced before taking effect." ] },
        ko: { name:"한국어", title:"개인정보 처리방침", app:"냥이 구조대: 스도쿠", effective:"시행일", operator:"운영자", contact:"문의", date:"2026년 8월 31일", updated:"최종 업데이트: 2026년 8월 31일", headings:["기본 원칙","기기에 저장되는 게임 데이터","광고 및 분석 서비스","동의 및 개인정보 선택","외부 링크","제3자 제공 및 국외 처리","보유 및 삭제","이용자의 권리","아동의 개인정보","안전성 확보 조치 및 변경"], body:["냥이 구조대: 스도쿠(이하 앱)는 회원가입을 요구하지 않으며 이름·이메일·전화번호·정확한 위치를 운영자의 서버로 직접 수집하거나 전송하지 않습니다.","게임 진행, 입력값, 메모, 완료 퍼즐, 플레이 기록, 구조 진행, 설정 및 광고 빈도 정보는 기기의 브라우저 또는 앱 WebView에 저장됩니다. 이어하기, 진행 복원, 통계 표시 및 광고 관리에 사용됩니다.","앱은 비개인화 광고를 위해 Google Mobile Ads SDK(AdMob)를 사용하고, 필요한 지역에서 Google User Messaging Platform(UMP)을 사용합니다. AdMob/UMP는 IP 주소와 대략적인 위치, 광고 상호작용, 앱·기기 식별자, SDK 성능·오류·진단 정보를 처리할 수 있습니다. 앱은 게임 이용 통계와 개선을 위해 Firebase Analytics(Google Analytics for Firebase)도 사용합니다. 게임 시작·완료, 힌트 사용, 보상형 광고 완료, 화면 이동 등의 이벤트와 앱 인스턴스 식별자, 세션 정보, 기기·앱 정보 및 대략적인 위치가 처리될 수 있습니다. 처리 범위와 보유 기간은 Google/Firebase 정책과 관련 법령에 따릅니다.","법령상 필요한 경우 광고 요청 전에 Google 동의 안내를 표시합니다. 가능한 경우 앱의 광고 개인정보 설정에서 선택 화면을 다시 열 수 있습니다. 필요한 처리를 허용하지 않으면 광고를 요청하지 않을 수 있습니다.","앱은 다른 앱이나 스토어 페이지 링크를 표시할 수 있으며, 외부 서비스의 정보 처리는 해당 서비스의 개인정보 처리방침을 따릅니다.","운영자는 게임 진행 데이터를 판매하거나 제공하지 않습니다. Google/Firebase는 정책과 관련 법령에 따라 광고 및 분석 정보를 국외 서버에서 처리할 수 있습니다.","기기 내 게임 데이터는 앱·사이트 데이터를 삭제하거나 앱을 삭제할 때까지 보유됩니다. 동의·광고·분석 정보는 Google/Firebase 정책과 관련 법령에 따른 기간 동안 보유됩니다. 기기 앱 데이터 또는 사이트 데이터를 삭제하거나 앱을 삭제하면 로컬 게임 데이터를 삭제할 수 있습니다.","기기 및 앱 개인정보 설정에서 광고 선택을 확인할 수 있습니다. 개인정보 문의 및 요청은 arcblack.app@gmail.com으로 보내주시기 바랍니다.","앱은 아동의 이름, 연락처 또는 계정 정보를 직접 수집하지 않습니다. 아동을 대상으로 배포하는 경우 관련 연령·광고·개인정보 보호조치를 적용해야 합니다.","앱 기능, 외부 서비스 또는 법령이 변경되면 이 방침을 수정할 수 있으며, 중요한 변경은 시행 전에 알립니다." ] },
        ja: { name:"日本語", title:"プライバシーポリシー", app:"にゃんこレスキュー：数独", effective:"施行日", operator:"運営者", contact:"お問い合わせ", date:"2026年8月31日", updated:"最終更新：2026年8月31日", headings:["基本方針","端末に保存されるゲームデータ","広告・分析サービス","同意とプライバシー設定","外部リンク","第三者提供と国外処理","保存期間と削除","利用者の権利","子どものプライバシー","安全管理と変更"], body:["本アプリは登録を求めず、氏名、メールアドレス、電話番号、正確な位置情報を運営者のサーバーへ直接収集・送信しません。","ゲーム進行、入力、メモ、履歴、救助進行、設定、広告頻度情報は端末のブラウザまたはWebViewに保存されます。","本アプリはAdMob、必要な地域ではGoogle UMPを利用します。IPアドレス、おおよその位置、広告操作、アプリ・端末識別子、SDKの性能・診断情報を処理する場合があります。またFirebase Analyticsを利用し、起動、完了、ヒント、報酬広告、画面遷移などのイベント、アプリインスタンス識別子、セッション、端末・アプリ情報、おおよその位置を処理する場合があります。Google/Firebaseの方針に従います。","法令上必要な場合、広告要求前に同意画面を表示します。利用可能な場合、アプリの広告プライバシー設定から再度選択できます。","外部リンクの処理は各サービスの方針に従います。","運営者はゲームデータを販売・提供しません。Google/Firebaseは国外サーバーで情報を処理する場合があります。","端末データはデータ消去またはアンインストールまで、同意・広告・分析情報はGoogle/Firebaseの方針と法令に従い保存されます。","お問い合わせはarcblack.app@gmail.comまでご連絡ください。","子どもの氏名、連絡先、アカウント情報を直接収集しません。","機能、サービス、法令の変更に応じて本方針を改定します。" ] }

        de: { name:"Deutsch", title:"Datenschutzerklärung", app:"Katzenrettung: Sudoku", headings:["Grundsätze","Auf dem Gerät gespeicherte Spieldaten","Werbe- und Analysedienste","Einwilligung und Datenschutzoptionen","Externe Links","Weitergabe und internationale Verarbeitung","Speicherung und Löschung","Ihre Rechte","Datenschutz von Kindern","Sicherheit und Änderungen"], body:["Die App verlangt keine Registrierung und übermittelt Namen, E-Mail-Adressen, Telefonnummern oder genaue Standortdaten nicht direkt an Server des Betreibers.","Spielstände, Eingaben, Notizen, abgeschlossene Rätsel, Spielverlauf, Rettungsfortschritt, Einstellungen und Informationen zur Werbehäufigkeit werden im Browser oder in der App-WebView auf dem Gerät gespeichert.","Die App kann Google Mobile Ads SDK (AdMob) für nicht personalisierte Werbung und Google UMP verwenden, wenn eine Einwilligung erforderlich ist. Dabei können IP-Adresse, ungefährer Standort, Werbeinteraktionen, App-/Gerätekennungen sowie Leistungs-, Fehler- und Diagnosedaten verarbeitet werden. Außerdem nutzt die App Firebase Analytics (Google Analytics for Firebase), um die Nutzung zu messen und das Spiel zu verbessern. Verarbeitet werden können Ereignisse wie Start, Abschluss, Hinweise, belohnte Werbung und Bildschirmwechsel sowie App-Instanzkennung, Sitzungs-, Geräte- und App-Informationen. Es gelten die Richtlinien von Google/Firebase.","Wenn gesetzlich erforderlich, wird vor einer Anzeigenanfrage ein Einwilligungsdialog angezeigt. Soweit verfügbar, können Werbeentscheidungen in den App-Datenschutzeinstellungen erneut geöffnet werden.","Links zu anderen Apps oder Store-Seiten unterliegen den Datenschutzrichtlinien des jeweiligen externen Dienstes.","Der Betreiber verkauft oder übermittelt keine Spieldaten. Google/Firebase kann Werbe- und Analysedaten nach eigenen Richtlinien und geltendem Recht auf Servern außerhalb Ihres Landes verarbeiten.","Gerätedaten bleiben bis zur Löschung der App-/Websitedaten oder Deinstallation gespeichert. Einwilligungs-, Werbe- und Analysedaten werden nach den Richtlinien von Google/Firebase und geltendem Recht gespeichert.","Für Fragen oder Anfragen zum Datenschutz kontaktieren Sie arcblack.app@gmail.com.","Die App erhebt die Namen, Kontaktdaten oder Kontoinformationen von Kindern nicht direkt. Bei einer Verbreitung an Kinder sind die geltenden Schutzmaßnahmen einzuhalten.","Diese Erklärung kann bei Änderungen der App, der Dienste oder des Rechts angepasst werden. Wesentliche Änderungen werden vorher angekündigt."] },
        fr: { name:"Français", title:"Politique de confidentialité", app:"Sauvetage félin : Sudoku", headings:["Principes généraux","Données de jeu stockées sur l’appareil","Services publicitaires et analytiques","Consentement et choix de confidentialité","Liens externes","Communication et traitement international","Conservation et suppression","Vos droits","Vie privée des enfants","Sécurité et modifications"], body:["L’App ne demande aucune inscription et ne transmet pas directement au serveur de l’exploitant le nom, l’adresse e-mail, le numéro de téléphone ou la position précise.","Les parties en cours, saisies, notes, historiques, progression, réglages et informations de fréquence publicitaire sont stockés dans le navigateur ou la WebView de l’appareil.","L’App peut utiliser Google Mobile Ads SDK (AdMob) pour des annonces non personnalisées et Google UMP lorsque le consentement est requis. Peuvent être traités : adresse IP, position approximative, interactions publicitaires, identifiants de l’appareil et de l’App, données de performance, d’erreur et de diagnostic. L’App utilise aussi Firebase Analytics (Google Analytics for Firebase) pour mesurer l’utilisation et améliorer le jeu. Les événements de démarrage, de fin, d’indices, de publicités récompensées et de changement d’écran, ainsi que l’identifiant d’instance, la session et les informations de l’appareil et de l’App, peuvent être traités selon les politiques Google/Firebase.","Lorsque la loi l’exige, un écran de consentement est affiché avant toute demande publicitaire. Lorsque disponible, les choix peuvent être rouverts dans les réglages de confidentialité de l’App.","Les liens vers d’autres Apps ou boutiques sont régis par la politique du service externe concerné.","L’exploitant ne vend ni ne communique les données de jeu. Google/Firebase peut traiter les données publicitaires et analytiques sur des serveurs situés hors de votre pays conformément à ses politiques et à la loi.","Les données de l’appareil sont conservées jusqu’à la suppression des données de l’App/du site ou la désinstallation. Les données de consentement, de publicité et d’analyse suivent les politiques Google/Firebase et la loi.","Pour toute question ou demande, contactez arcblack.app@gmail.com.","L’App ne collecte pas directement les noms, coordonnées ou comptes d’enfants. Les protections légales applicables doivent être respectées.","Cette politique peut être modifiée en cas d’évolution de l’App, des services ou de la loi. Les changements importants seront annoncés à l’avance."] },
        es: { name:"Español", title:"Política de privacidad", app:"Rescate felino: Sudoku", headings:["Principios generales","Datos de juego almacenados en el dispositivo","Servicios de publicidad y análisis","Consentimiento y opciones de privacidad","Enlaces externos","Cesión y tratamiento internacional","Conservación y eliminación","Tus derechos","Privacidad infantil","Seguridad y cambios"], body:["La App no exige registro ni transmite directamente a los servidores del operador nombres, correos electrónicos, teléfonos o ubicaciones precisas.","Las partidas, entradas, notas, historial, progreso, ajustes e información de frecuencia publicitaria se guardan en el navegador o WebView del dispositivo.","La App puede usar Google Mobile Ads SDK (AdMob) para anuncios no personalizados y Google UMP cuando se requiere consentimiento. Puede tratar la IP, ubicación aproximada, interacciones publicitarias, identificadores del dispositivo y de la App y datos de rendimiento, errores y diagnóstico. También usa Firebase Analytics (Google Analytics for Firebase) para medir el uso y mejorar el juego. Pueden tratarse eventos de inicio, finalización, pistas, anuncios recompensados y cambios de pantalla, junto con el identificador de instancia, sesión e información del dispositivo y la App, conforme a las políticas de Google/Firebase.","Cuando la ley lo exige, se muestra una pantalla de consentimiento antes de solicitar anuncios. Cuando esté disponible, las opciones pueden abrirse de nuevo desde la privacidad de la App.","Los enlaces a otras Apps o tiendas se rigen por la política del servicio externo.","El operador no vende ni comparte datos de juego. Google/Firebase puede tratar datos publicitarios y analíticos en servidores fuera de su país conforme a sus políticas y la ley.","Los datos del dispositivo se conservan hasta borrar los datos de la App/sitio o desinstalarla. Los datos de consentimiento, publicidad y análisis se conservan según las políticas de Google/Firebase y la ley.","Para consultas o solicitudes de privacidad, contacte con arcblack.app@gmail.com.","La App no recopila directamente nombres, contactos ni cuentas de menores. Deben aplicarse las protecciones legales correspondientes.","La política puede cambiar por modificaciones de la App, los servicios o la ley. Los cambios importantes se anunciarán previamente."] },
        it: { name:"Italiano", title:"Informativa sulla privacy", app:"Salvataggio gatti: Sudoku", headings:["Principi generali","Dati di gioco memorizzati sul dispositivo","Servizi pubblicitari e analitici","Consenso e scelte sulla privacy","Link esterni","Comunicazione e trattamento internazionale","Conservazione e cancellazione","I tuoi diritti","Privacy dei minori","Sicurezza e modifiche"], body:["L’App non richiede registrazione e non trasmette direttamente ai server del titolare nomi, e-mail, numeri di telefono o posizione precisa.","Partite, inserimenti, note, cronologia, progressi, impostazioni e informazioni sulla frequenza pubblicitaria sono memorizzati nel browser o nella WebView del dispositivo.","L’App può usare Google Mobile Ads SDK (AdMob) per annunci non personalizzati e Google UMP quando è richiesto il consenso. Possono essere trattati IP, posizione approssimativa, interazioni pubblicitarie, identificativi del dispositivo e dell’App, dati di prestazioni, errori e diagnostica. L’App usa anche Firebase Analytics (Google Analytics for Firebase) per misurare l’utilizzo e migliorare il gioco. Possono essere trattati eventi di avvio, completamento, suggerimenti, annunci con premio e cambi di schermata, oltre a identificativo dell’istanza, sessione e informazioni del dispositivo e dell’App, secondo le norme Google/Firebase.","Quando richiesto dalla legge, il consenso viene mostrato prima di una richiesta pubblicitaria. Se disponibile, le scelte possono essere riaperte dalle impostazioni privacy dell’App.","I link ad altre App o store sono regolati dall’informativa del servizio esterno.","Il titolare non vende né condivide dati di gioco. Google/Firebase può trattare dati pubblicitari e analitici su server esteri secondo le proprie norme e la legge.","I dati del dispositivo restano fino alla cancellazione dei dati dell’App/sito o alla disinstallazione. I dati di consenso, pubblicità e analisi seguono le norme Google/Firebase e la legge.","Per domande o richieste sulla privacy, contattare arcblack.app@gmail.com.","L’App non raccoglie direttamente nomi, contatti o account di minori. Devono essere applicate le tutele previste dalla legge.","L’informativa può cambiare con modifiche all’App, ai servizi o alla legge. Le modifiche importanti saranno annunciate in anticipo."] },
        tr: { name:"Türkçe", title:"Gizlilik Politikası", app:"Kedi Kurtarma: Sudoku", headings:["Genel ilkeler","Cihazda saklanan oyun verileri","Reklam ve analiz hizmetleri","Onay ve gizlilik seçenekleri","Harici bağlantılar","Üçüncü taraf paylaşımı ve uluslararası işleme","Saklama ve silme","Haklarınız","Çocukların gizliliği","Güvenlik ve değişiklikler"], body:["Uygulama kayıt istemez; ad, e-posta, telefon numarası veya kesin konumu işletmecinin sunucularına doğrudan göndermez.","Oyunlar, girişler, notlar, geçmiş, ilerleme, ayarlar ve reklam sıklığı bilgileri cihazdaki tarayıcıda veya WebView’da saklanır.","Uygulama kişiselleştirilmemiş reklamlar için Google Mobile Ads SDK (AdMob), onay gereken durumlarda Google UMP kullanabilir. IP adresi, yaklaşık konum, reklam etkileşimleri, cihaz ve uygulama tanımlayıcıları ile performans, hata ve tanılama verileri işlenebilir. Uygulama ayrıca kullanımı ölçmek ve oyunu geliştirmek için Firebase Analytics (Google Analytics for Firebase) kullanır. Başlatma, tamamlama, ipucu, ödüllü reklam ve ekran geçişi etkinlikleri ile uygulama örneği kimliği, oturum, cihaz ve uygulama bilgileri Google/Firebase politikalarına göre işlenebilir.","Yasanın gerektirdiği durumlarda reklam isteğinden önce onay ekranı gösterilir. Kullanılabiliyorsa seçimler uygulamanın gizlilik ayarlarından yeniden açılabilir.","Diğer uygulama veya mağaza bağlantıları ilgili harici hizmetin politikasına tabidir.","İşletmeci oyun verilerini satmaz veya paylaşmaz. Google/Firebase reklam ve analiz verilerini kendi politikalarına ve yasalara göre yurt dışındaki sunucularda işleyebilir.","Cihaz verileri uygulama/site verileri silinene veya uygulama kaldırılana kadar saklanır. Onay, reklam ve analiz verileri Google/Firebase politikaları ve yasalara göre saklanır.","Gizlilik soruları veya talepleri için arcblack.app@gmail.com adresine ulaşabilirsiniz.","Uygulama çocukların ad, iletişim veya hesap bilgilerini doğrudan toplamaz. Geçerli yasal korumalar uygulanmalıdır.","Uygulama, hizmet veya yasalar değiştiğinde bu politika güncellenebilir. Önemli değişiklikler önceden duyurulur."] }
      };

      const supported = Object.keys(common);
      const detect = () => { const requested = new URLSearchParams(window.location.search).get("lang"); if (requested && supported.includes(requested.toLowerCase())) return requested.toLowerCase(); const saved = localStorage.getItem("gamesudoku-policy-language"); if (supported.includes(saved)) return saved; return (navigator.languages || [navigator.language || "en"]).map(v => String(v).toLowerCase().split("-")[0]).find(v => supported.includes(v)) || "en"; };
      const render = (language) => { const policy = common[language]; document.documentElement.lang = language; document.title = `${policy.title} | ${policy.app}`; const root = document.getElementById("policy"); root.replaceChildren(); const chooser = document.createElement("div"); chooser.className="language"; const label=document.createElement("label"); label.textContent="Language / 언어"; label.htmlFor="language-select"; const select=document.createElement("select"); select.id="language-select"; select.setAttribute("aria-label","Language"); supported.forEach(key=>{ const option=document.createElement("option"); option.value=key; option.textContent=languageNames[key]; option.selected=key===language; select.append(option); }); select.addEventListener("change",()=>{ localStorage.setItem("gamesudoku-policy-language",select.value); render(select.value); }); chooser.append(label,select); root.append(chooser); const header=document.createElement("header"); const h1=document.createElement("h1"); h1.textContent=policy.title; const app=document.createElement("p"); app.className="app-name"; app.textContent=policy.app; header.append(h1,app); root.append(header); policy.headings.forEach((heading,index)=>{ const section=document.createElement("section"); const h2=document.createElement("h2"); h2.textContent=`${index+1}. ${heading}`; const p=document.createElement("p"); p.textContent=policy.body[index]; section.append(h2,p); root.append(section); }); const meta=document.createElement("p"); meta.className="updated"; meta.textContent=`${policy.effective}: ${policy.date} · ${policy.operator}: Arcblack · ${policy.contact}: arcblack.app@gmail.com`; const footer=document.createElement("footer"); footer.append(meta); root.append(footer); };
      render(detect());
    })();
  </script>
</body>
</html>
